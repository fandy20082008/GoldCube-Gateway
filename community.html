<script>
(function(){
  const root=document.documentElement, btn=document.getElementById('themeToggle');
  const sun="<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"/><path d=\"M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7\"/></svg>", moon="<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z\"/></svg>";
  function apply(d){root.classList.toggle('dark',d);btn.innerHTML=d?moon:sun;btn.setAttribute('aria-label',d?'切换浅色模式':'切换深色模式');localStorage.setItem('goldcube-theme',d?'dark':'light');}
  apply(localStorage.getItem('goldcube-theme')==='dark');
  btn.addEventListener('click',()=>apply(!root.classList.contains('dark')));
})();
</script>

<script>(function(){document.querySelectorAll('.like-btn').forEach(function(b){b.addEventListener('click',function(){var s=b.querySelector('span'),v=parseInt(s.textContent),on=b.classList.toggle('liked');s.textContent=on?v+1:v-1;b.style.color=on?'#FF6B6B':'';b.style.transform=on?'scale(1.15)':'scale(1)';b.style.transition='transform .15s';});});})();</script>
<script>
(function(){
  // like behavior for heart buttons (those showing a count)
  document.querySelectorAll('.feed-item .fi-actions button').forEach(function(b){
    var m = b.textContent.match(/(\d+)/);
    if(!m) return;
    b.dataset.n = m[1];
    b.innerHTML = b.innerHTML.replace(m[1], '<span>'+m[1]+'</span>');
    b.addEventListener('click', function(){
      var s = b.querySelector('span'), cur = parseInt(s.textContent);
      var on = b.classList.toggle('liked');
      s.textContent = on ? cur+1 : cur-1;
      b.style.color = on ? '#FF6B6B' : '';
      b.style.transform = 'scale(1.18)'; b.style.transition='transform .15s';
      setTimeout(function(){ b.style.transform='scale(1)'; },150);
    });
  });
})();
</script>
