name: GoldCube source governance structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; same pin as application repository
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; same pin as application repository
        with:
          node-version: "22"
      - run: node --test scripts/check-open-source.test.mjs
      - run: node scripts/check-open-source.mjs structure
  snapshot-provenance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify trusted public snapshot
        env:
          GOLDCUBE_SNAPSHOT_COMPONENT: gateway
          GOLDCUBE_SNAPSHOT_PROOF: ${{ vars.GOLDCUBE_SNAPSHOT_PROOF }}
          GOLDCUBE_SNAPSHOT_PROOF_SHA256: ${{ vars.GOLDCUBE_SNAPSHOT_PROOF_SHA256 }}
        run: node scripts/check-public-snapshot.mjs
